<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="bricks" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#120c08"/>
      <rect x="1" y="1" width="37" height="8" fill="#171109"/>
      <rect x="21" y="11" width="18" height="8" fill="#171109"/>
      <rect x="1" y="11" width="18" height="8" fill="#171109"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#0d0806" stroke-width="1"/>
      <line x1="0" y1="10" x2="40" y2="10" stroke="#0d0806" stroke-width="0.5"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#0d0806" stroke-width="1"/>
      <line x1="20" y1="0" x2="20" y2="10" stroke="#0d0806" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background: stone brick -->
  <rect width="800" height="200" fill="url(#bricks)"/>

  <!-- Outer border -->
  <rect x="3" y="3" width="794" height="194" fill="none" stroke="#5c3a1a" stroke-width="2"/>
  <!-- Inner border -->
  <rect x="8" y="8" width="784" height="184" fill="none" stroke="#2e1c0e" stroke-width="1"/>

  <!-- Corner ornaments -->
  <rect x="3" y="3" width="16" height="16" fill="#5c3a1a"/>
  <rect x="5" y="5" width="12" height="12" fill="#120c08"/>
  <rect x="7" y="7" width="8" height="8" fill="#8b5a2b"/>
  <rect x="9" y="9" width="4" height="4" fill="#d4a017"/>

  <rect x="781" y="3" width="16" height="16" fill="#5c3a1a"/>
  <rect x="783" y="5" width="12" height="12" fill="#120c08"/>
  <rect x="785" y="7" width="8" height="8" fill="#8b5a2b"/>
  <rect x="787" y="9" width="4" height="4" fill="#d4a017"/>

  <rect x="3" y="181" width="16" height="16" fill="#5c3a1a"/>
  <rect x="5" y="183" width="12" height="12" fill="#120c08"/>
  <rect x="7" y="185" width="8" height="8" fill="#8b5a2b"/>
  <rect x="9" y="187" width="4" height="4" fill="#d4a017"/>

  <rect x="781" y="181" width="16" height="16" fill="#5c3a1a"/>
  <rect x="783" y="183" width="12" height="12" fill="#120c08"/>
  <rect x="785" y="185" width="8" height="8" fill="#8b5a2b"/>
  <rect x="787" y="187" width="4" height="4" fill="#d4a017"/>

  <!-- Left torch: ambient glow -->
  <circle cx="65" cy="100" r="22" fill="#ff6600" opacity="0.06"/>
  <!-- Left torch: flame (outer to inner) -->
  <ellipse cx="65" cy="101" rx="10" ry="15" fill="#8b2000" opacity="0.6"/>
  <ellipse cx="65" cy="99" rx="7" ry="11" fill="#cc4400"/>
  <ellipse cx="65" cy="97" rx="5" ry="8" fill="#ff8800"/>
  <ellipse cx="65" cy="95" rx="3" ry="5" fill="#ffcc00"/>
  <ellipse cx="65" cy="93" rx="2" ry="3" fill="#fff8cc"/>
  <!-- Left torch: handle + base -->
  <rect x="62" y="108" width="6" height="25" fill="#3d2008" rx="1"/>
  <rect x="56" y="131" width="18" height="4" fill="#3d2008" rx="1"/>
  <rect x="58" y="135" width="14" height="2" fill="#2a1505"/>

  <!-- Right torch: ambient glow -->
  <circle cx="735" cy="100" r="22" fill="#ff6600" opacity="0.06"/>
  <!-- Right torch: flame -->
  <ellipse cx="735" cy="101" rx="10" ry="15" fill="#8b2000" opacity="0.6"/>
  <ellipse cx="735" cy="99" rx="7" ry="11" fill="#cc4400"/>
  <ellipse cx="735" cy="97" rx="5" ry="8" fill="#ff8800"/>
  <ellipse cx="735" cy="95" rx="3" ry="5" fill="#ffcc00"/>
  <ellipse cx="735" cy="93" rx="2" ry="3" fill="#fff8cc"/>
  <!-- Right torch: handle + base -->
  <rect x="732" y="108" width="6" height="25" fill="#3d2008" rx="1"/>
  <rect x="726" y="131" width="18" height="4" fill="#3d2008" rx="1"/>
  <rect x="728" y="135" width="14" height="2" fill="#2a1505"/>

  <!-- Skull pixel art (4px/px scale, 8×6 grid = 32×24px, centered at x=400) -->
  <!-- Row 0: .XXXXXX. -->
  <rect x="388" y="10" width="24" height="4" fill="#c8a870"/>
  <!-- Row 1: XXXXXXXX -->
  <rect x="384" y="14" width="32" height="4" fill="#c8a870"/>
  <!-- Row 2: X.XXXX.X  (eye sockets at cols 1 and 6) -->
  <rect x="384" y="18" width="4" height="4" fill="#c8a870"/>
  <rect x="392" y="18" width="16" height="4" fill="#c8a870"/>
  <rect x="412" y="18" width="4" height="4" fill="#c8a870"/>
  <!-- Row 3: XXXXXXXX -->
  <rect x="384" y="22" width="32" height="4" fill="#c8a870"/>
  <!-- Row 4: .XXXXXX. -->
  <rect x="388" y="26" width="24" height="4" fill="#c8a870"/>
  <!-- Row 5: .XX..XX. (teeth) -->
  <rect x="388" y="30" width="8" height="4" fill="#c8a870"/>
  <rect x="404" y="30" width="8" height="4" fill="#c8a870"/>

  <!-- Decorative divider -->
  <line x1="100" y1="46" x2="370" y2="46" stroke="#5c3a1a" stroke-width="1"/>
  <line x1="430" y1="46" x2="700" y2="46" stroke="#5c3a1a" stroke-width="1"/>
  <!-- Diamond ornament at center -->
  <polygon points="400,38 410,46 400,54 390,46" fill="#5c3a1a"/>
  <polygon points="400,40 408,46 400,52 392,46" fill="#120c08"/>
  <polygon points="400,42 406,46 400,50 394,46" fill="#8b5a2b"/>
  <polygon points="400,44 404,46 400,48 396,46" fill="#d4a017"/>

  <!-- Main title shadow (drawn first, behind) -->
  <text x="403" y="106"
        font-family="'Courier New', Courier, monospace"
        font-size="44"
        font-weight="bold"
        fill="#3d1a00"
        text-anchor="middle"
        letter-spacing="3">CATACOMB SNATCH</text>

  <!-- Main title -->
  <text x="400" y="103"
        font-family="'Courier New', Courier, monospace"
        font-size="44"
        font-weight="bold"
        fill="#d4a017"
        text-anchor="middle"
        letter-spacing="3"
        filter="url(#glow)">CATACOMB SNATCH</text>

  <!-- REDUX subtitle -->
  <text x="400" y="136"
        font-family="'Courier New', Courier, monospace"
        font-size="26"
        font-weight="bold"
        fill="#b87333"
        text-anchor="middle"
        letter-spacing="10">REDUX</text>

  <!-- Tech stack line -->
  <text x="400" y="166"
        font-family="'Courier New', Courier, monospace"
        font-size="11"
        fill="#6b5030"
        text-anchor="middle"
        letter-spacing="2">TypeScript  ·  PixiJS  ·  Miniplex ECS</text>
</svg>
